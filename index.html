<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Cache Control: Sempre buscar versão nova do HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="icon" type="image/png" href="/img/icon-192.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4531" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JCV Distribuidora" />
    <meta name="description" content="Catálogo Oficial e Sistema de Orçamentos 2026 - JCV Distribuidora / Rawell Química. Defensivos, herbicidas seletivos e adjuvantes." />
    <link rel="manifest" href="/manifest.json" />
    <title>JCV Distribuidora — Catálogo Oficial & Orçamentos 2026</title>

    <!-- Open Graph (WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JCV Distribuidora — Catálogo Oficial & Orçamentos 2026" />
    <meta property="og:title" content="JCV Distribuidora — Catálogo Oficial & Orçamentos 2026" />
    <meta property="og:description" content="Catálogo Oficial e Sistema de Orçamentos 2026 - JCV Distribuidora / Rawell Química. Defensivos, herbicidas seletivos e adjuvantes." />
    <meta property="og:image" content="https://catalognafog.onrender.com/img/logo.png" />
    <meta property="og:image:secure_url" content="https://catalognafog.onrender.com/img/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://catalognafog.onrender.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JCV Distribuidora — Catálogo Oficial & Orçamentos 2026" />
    <meta name="twitter:description" content="Catálogo Oficial e Sistema de Orçamentos 2026 - JCV Distribuidora / Rawell Química." />
    <meta name="twitter:image" content="https://catalognafog.onrender.com/img/logo.png" />

    <!-- Limpeza de Service Workers e Caches Antigos -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            if (name.includes('jcv-jardinagem-v3-cache-v12') || name.includes('v13')) {
              caches.delete(name);
            }
          }
        });
      }
    </script>
    <script>
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.remove('dark');
    </script>


    
    
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
