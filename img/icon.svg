<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Círculo interno decorativo -->
  <circle cx="256" cy="230" r="170" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Ícone de Folha / Planta em Destaque com sombra -->
  <g filter="url(#shadow)" transform="translate(256, 215) scale(2.8)">
    <!-- Folha Central Principal -->
    <path d="M0 -42 C28 -30 38 -5 30 22 C22 42 2 48 0 52 C-2 48 -22 42 -30 22 C-38 -5 -28 -30 0 -42 Z" fill="#ffffff"/>
    <!-- Nervura da Folha -->
    <path d="M0 -34 L0 46" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0 -15 C8 -10 16 -12 20 -20" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 0 C10 5 18 2 22 -6" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 15 C8 20 16 18 20 12" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 -15 C-8 -10 -16 -12 -20 -20" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 0 C-10 5 -18 2 -22 -6" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 15 C-8 20 -16 18 -20 12" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Broto Dourado -->
    <circle cx="0" cy="-44" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Texto RAWELL QUÍMICA 2026 -->
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="4">RAWELL</text>
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#goldGrad)" letter-spacing="6">CATÁLOGO 2026</text>
</svg>