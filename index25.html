<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nfog Catálogo — The Gazette Chronicle Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --news-bg: #f9f5ea;
      --news-paper: #ffffff;
      --news-ink: #111111;
      --news-muted: #555555;
      --news-border: #111111;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Newsreader', serif;
      background-color: var(--news-bg);
      color: var(--news-ink);
      line-height: 1.5;
    }
    h1, h2, h3, .news-masthead, .news-tag { font-family: 'Playfair Display', serif; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .news-wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

    /* MASTHEAD */
    .news-header {
      border-bottom: 3px double var(--news-border);
      padding: 1.5rem 0 1rem; text-align: center;
    }
    .news-topline {
      display: flex; justify-content: space-between; border-bottom: 1px solid var(--news-border);
      padding-bottom: 0.3rem; margin-bottom: 1rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .news-masthead {
      font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1; margin-bottom: 0.5rem;
    }
    .news-sub-masthead {
      font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; font-style: italic; border-top: 1px solid var(--news-border); padding-top: 0.4rem;
    }

    /* SEARCH & CONTROLS */
    .news-ctrls {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1rem 0; border-bottom: 1px solid var(--news-border); margin-bottom: 2rem;
    }
    .news-search input {
      background: transparent; border: 1px solid var(--news-border); padding: 0.5rem 1rem; font-family: inherit; font-size: 0.9rem; width: 320px;
    }
    .news-cart-btn {
      background: var(--news-ink); color: #fff; border: none; padding: 0.6rem 1.4rem; font-weight: 700; text-transform: uppercase; font-size: 0.82rem; letter-spacing: 0.05em;
    }

    /* CATEGORIES BAR */
    .news-cats {
      display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--news-border); padding-bottom: 1rem; flex-wrap: wrap;
    }
    .news-cat-btn {
      background: none; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Playfair Display', serif;
    }
    .news-cat-btn.active, .news-cat-btn:hover { text-decoration: underline; }

    /* GRID */
    .news-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 2rem; margin-bottom: 5rem;
    }
    .news-card {
      border: 1px solid var(--news-border); padding: 1.2rem; background: #fff; display: flex; flex-direction: column;
      box-shadow: 3px 3px 0px var(--news-border);
    }
    .news-card-img { width: 100%; height: 180px; object-fit: cover; border: 1px solid #ccc; margin-bottom: 0.8rem; filter: grayscale(0.5); }
    .news-card:hover .news-card-img { filter: none; }
    .news-ref { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--news-muted); margin-bottom: 0.3rem; }
    .news-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; }
    .news-desc { font-size: 0.85rem; color: var(--news-muted); line-height: 1.5; margin-bottom: 1.2rem; flex: 1; text-align: justify; }
    .news-row { display: flex; gap: 0.4rem; align-items: center; border-top: 1px solid #eee; padding-top: 0.8rem; }
    .news-qty { display: flex; border: 1px solid var(--news-border); }
    .news-qty button { width: 26px; height: 30px; background: #eee; border: none; font-weight: 700; }
    .news-qty input { width: 32px; border: none; text-align: center; font-family: inherit; font-size: 0.85rem; }
    .news-add-btn {
      flex: 1; background: var(--news-ink); color: #fff; border: none; padding: 0.5rem; font-weight: 700; font-size: 0.75rem; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="news-wrap">
    <header class="news-header">
      <div class="news-topline">
        <span>Edição Especial // N° 104</span>
        <span>Catálogo Oficial de Cotações</span>
        <span>Envio Direto no WhatsApp</span>
      </div>
      <h1 class="news-masthead">The Industrial Gazette</h1>
      <div class="news-sub-masthead">Registro Completo de Equipamentos, Produtos e Insumos</div>
    </header>

    <div class="news-ctrls">
      <div class="news-search">
        <input type="search" id="search-input" placeholder="Pesquisar nos arquivos...">
      </div>
      <button class="news-cart-btn cart-toggle">
        Despacho (<span class="cart-badge">0</span> itens)
      </button>
    </div>

    <div class="news-cats" id="news-cats"></div>
    <div class="news-grid" id="produtos-grid"></div>
    <div id="nenhum-produto" style="display:none; text-align:center; padding:3rem;"><p>Nenhum registro encontrado.</p></div>
  </div>

  <!-- CART DRAWER -->
  <div id="overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1999; opacity:0; pointer-events:none; transition:0.2s;"></div>
  <aside id="cart-drawer" style="position:fixed; top:0; right:0; height:100%; width:min(420px, 100vw); background:#fff; border-left:3px double #000; z-index:2000; transform:translateX(100%); transition:0.3s; display:flex; flex-direction:column;">
    <div style="padding:1.5rem; border-bottom:1px solid #000; display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-family:'Playfair Display',serif; font-size:1.3rem;">Manifesto de Orçamento</h3>
      <button id="cart-close" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <div id="cart-empty" style="padding:3rem 1.5rem; text-align:center; color:#888;"><p>Nenhum item adicionado ao manifesto.</p></div>
    <div id="cart-items-list" style="flex:1; overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:0.6rem;"></div>
    <div id="cart-footer" style="padding:1.25rem; border-top:1px solid #000; background:#f9f5ea;">
      <div class="orcamento-form" style="border:1px solid #000; padding:0.8rem; margin-bottom:0.8rem; background:#fff;">
        <input type="text" id="f-nome" placeholder="Nome Completo *" style="width:100%; border:1px solid #ccc; padding:0.45rem; margin-bottom:0.4rem; font-family:inherit;">
        <input type="tel" id="f-tel" placeholder="WhatsApp *" style="width:100%; border:1px solid #ccc; padding:0.45rem; margin-bottom:0.4rem; font-family:inherit;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.4rem;">
          <input type="text" id="f-cnpj" placeholder="CNPJ" style="border:1px solid #ccc; padding:0.45rem; font-family:inherit;">
          <input type="text" id="f-vendedor" placeholder="Vendedor" style="border:1px solid #ccc; padding:0.45rem; font-family:inherit;">
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:0.6rem;">
        <span>Total Registros:</span><span id="cart-total-count">0</span>
      </div>
      <button id="btn-whatsapp-send" class="news-cart-btn" style="width:100%; padding:0.75rem; cursor:pointer;">
        Transmitir Despacho via WhatsApp
      </button>
      <button id="btn-limpar" style="width:100%; text-align:center; background:none; border:none; margin-top:0.4rem; font-size:0.75rem; color:#666; cursor:pointer;">Limpar Manifesto</button>
    </div>
  </aside>

  <div id="cart-feedback" style="display:none"></div>

  <!-- COMPATIBILITY HOOKS -->
  <div id="banner-slider" style="display:none"><div class="banner-slide"></div><button id="banner-prev"></button><button id="banner-next"></button><div class="banner-dots"><button class="banner-dot"></button></div></div>
  <div id="categorias-grid" style="display:none"></div>
  <div id="filtros-bar" style="display:none"></div>
  <div id="produtos-section" style="display:none"></div>

  <script src="js/produtos.js"></script>
  <script src="js/carrinho.js"></script>
  <script>
    function renderProdutos(catId, termoBusca = '') {
      const grid = document.getElementById('produtos-grid');
      const empty = document.getElementById('nenhum-produto');
      if (!grid) return;
      let lista = PRODUTOS;
      if (catId && catId !== 'todos') lista = lista.filter(p => p.categoria === catId);
      if (termoBusca) {
        const t = termoBusca.toLowerCase();
        lista = lista.filter(p => p.nome.toLowerCase().includes(t) || p.referencia.toLowerCase().includes(t) || p.descricao.toLowerCase().includes(t));
      }
      if (lista.length === 0) { grid.innerHTML = ''; if (empty) empty.style.display = 'block'; return; }
      if (empty) empty.style.display = 'none';
      grid.innerHTML = lista.map(p => `
        <div class="news-card">
          <img src="${p.imagens[0]}" alt="${p.nome}" class="news-card-img" onerror="this.src='https://picsum.photos/seed/news${p.id}/400/300'">
          <div class="news-ref">Reg. N° ${p.referencia}</div>
          <h3 class="news-title"><a href="produto.html?id=${p.id}">${p.nome}</a></h3>
          <p class="news-desc">${p.descricao}</p>
          <div class="news-row">
            <div class="news-qty">
              <button onclick="decrementarCard(${p.id})">−</button>
              <input type="number" id="qty-${p.id}" value="1" min="1" readonly>
              <button onclick="incrementarCard(${p.id})">+</button>
            </div>
            <button class="news-add-btn" onclick="adicionarAoOrcamento(${p.id})">+ Incluir</button>
          </div>
        </div>
      `).join('');
    }
    function initCategorias() {
      const row = document.getElementById('news-cats');
      if (row) {
        row.innerHTML = CATEGORIAS.map(c => `
          <button class="news-cat-btn ${c.id === 'todos' ? 'active' : ''}" onclick="filtrarPor('${c.id}')">
            ${c.nome}
          </button>
        `).join('');
      }
    }
    function filtrarPor(catId) {
      document.querySelectorAll('.news-cat-btn').forEach(p => p.classList.toggle('active', p.getAttribute('onclick')?.includes(`'${catId}'`)));
      renderProdutos(catId, document.getElementById('search-input')?.value || '');
    }
    function incrementarCard(id) { const i = document.getElementById(`qty-${id}`); if(i) i.value = parseInt(i.value)+1; }
    function decrementarCard(id) { const i = document.getElementById(`qty-${id}`); if(i && parseInt(i.value)>1) i.value = parseInt(i.value)-1; }
    function adicionarAoOrcamento(id) { const i = document.getElementById(`qty-${id}`); Carrinho.adicionar(id, parseInt(i?.value)||1); }
    function initSearch() { document.getElementById('search-input')?.addEventListener('input', e => renderProdutos('todos', e.target.value)); }
    document.addEventListener('DOMContentLoaded', () => { initCategorias(); renderProdutos('todos'); initSearch(); });
  </script>
</body>
</html>
