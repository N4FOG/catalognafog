<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nfog Catálogo — Holographic Sci-Fi HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --hud-bg: #030712;
      --hud-panel: rgba(15, 23, 42, 0.75);
      --hud-cyan: #38bdf8;
      --hud-purple: #a855f7;
      --hud-pink: #ec4899;
      --hud-border: rgba(56, 189, 248, 0.25);
      --hud-text: #f8fafc;
      --hud-muted: #94a3b8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Oxanium', sans-serif;
      background-color: var(--hud-bg);
      color: var(--hud-text);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.12) 0%, transparent 50%);
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .hud-wrap { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }

    /* HEADER */
    .hud-header {
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--hud-border);
      padding: 1rem 0; position: sticky; top: 0; z-index: 1000;
    }
    .hud-nav {
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
    }
    .hud-logo {
      font-size: 1.3rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 0.6rem;
    }
    .hud-search {
      flex: 1; max-width: 440px; position: relative;
    }
    .hud-search input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--hud-border);
      color: #fff; padding: 0.6rem 1rem 0.6rem 2.4rem; border-radius: 8px; font-family: inherit; font-size: 0.85rem;
    }
    .hud-search input:focus { outline: none; border-color: var(--hud-cyan); box-shadow: 0 0 15px rgba(56,189,248,0.4); }
    .hud-search svg { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--hud-cyan); }
    .hud-cart-btn {
      background: linear-gradient(135deg, var(--hud-cyan), var(--hud-purple));
      color: #000; font-weight: 800; border: none; padding: 0.65rem 1.4rem; border-radius: 8px; font-size: 0.85rem;
      box-shadow: 0 0 20px rgba(56,189,248,0.4);
    }

    /* HERO */
    .hud-hero {
      padding: 3.5rem 0 2rem; text-align: center;
    }
    .hud-hero-tag {
      background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.4);
      color: var(--hud-purple); padding: 0.3rem 0.9rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-bottom: 1rem;
    }
    .hud-hero-title {
      font-size: clamp(2.2rem, 4.5vw, 3.8rem); font-weight: 800; line-height: 1.15; margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, #38bdf8 50%, #a855f7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hud-hero-desc { color: var(--hud-muted); max-width: 550px; margin: 0 auto 2rem; font-size: 1rem; }

    /* CATS */
    .hud-cats {
      display: flex; justify-content: center; gap: 0.6rem; margin-bottom: 2.5rem; overflow-x: auto; padding-bottom: 0.5rem;
    }
    .hud-cat-pill {
      background: var(--hud-panel); border: 1px solid var(--hud-border);
      padding: 0.55rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700; color: var(--hud-muted);
      cursor: pointer; transition: 0.2s; white-space: nowrap;
    }
    .hud-cat-pill:hover, .hud-cat-pill.active {
      background: rgba(56, 189, 248, 0.15); border-color: var(--hud-cyan); color: #fff;
      box-shadow: 0 0 15px rgba(56,189,248,0.3);
    }

    /* GRID */
    .hud-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem; margin-bottom: 5rem;
    }
    .hud-card {
      background: var(--hud-panel); border: 1px solid var(--hud-border);
      border-radius: 12px; padding: 1rem; display: flex; flex-direction: column;
      backdrop-filter: blur(12px); transition: 0.25s;
    }
    .hud-card:hover {
      border-color: var(--hud-cyan); transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px rgba(56,189,248,0.2);
    }
    .hud-card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 0.8rem; }
    .hud-sku { color: var(--hud-cyan); font-size: 0.72rem; font-weight: 700; margin-bottom: 0.2rem; }
    .hud-card-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
    .hud-card-desc { font-size: 0.8rem; color: var(--hud-muted); margin-bottom: 1.2rem; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hud-card-row { display: flex; gap: 0.4rem; align-items: center; }
    .hud-qty { display: flex; background: rgba(255,255,255,0.05); border: 1px solid var(--hud-border); border-radius: 6px; }
    .hud-qty button { width: 26px; height: 30px; background: none; border: none; color: #fff; font-weight: 700; }
    .hud-qty input { width: 30px; background: transparent; border: none; color: #fff; text-align: center; font-family: inherit; font-size: 0.85rem; font-weight: 700; }
    .hud-add-btn {
      flex: 1; background: linear-gradient(135deg, var(--hud-cyan), var(--hud-purple));
      color: #000; font-weight: 800; border: none; border-radius: 6px; padding: 0.5rem; font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header class="hud-header">
    <div class="hud-wrap hud-nav">
      <a href="index26.html" class="hud-logo">
        <span>🌌</span> NFOG // HOLOGRAPHIC
      </a>
      <div class="hud-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search-input" placeholder="Buscar módulo no inventário...">
      </div>
      <button class="hud-cart-btn cart-toggle">
        ORÇAMENTO (<span class="cart-badge">0</span>)
      </button>
    </div>
  </header>

  <main class="hud-wrap">
    <section class="hud-hero">
      <span class="hud-hero-tag">⚡ PROTOCOLO HOLOGRÁFICO 2025</span>
      <h1 class="hud-hero-title">COTAÇÃO EM TEMPO REAL</h1>
      <p class="hud-hero-desc">Interface futurista integrada para seleção de produtos e despacho imediato para canais corporativos WhatsApp.</p>
    </section>

    <div class="hud-cats" id="hud-cats"></div>
    <div class="hud-grid" id="produtos-grid"></div>
    <div id="nenhum-produto" style="display:none; text-align:center; padding:3rem;"><p style="color:var(--hud-muted);">Nenhum módulo localizado.</p></div>
  </main>

  <!-- CART DRAWER -->
  <div id="overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1999; opacity:0; pointer-events:none; transition:0.2s;"></div>
  <aside id="cart-drawer" style="position:fixed; top:0; right:0; height:100%; width:min(420px, 100vw); background:#060a14; border-left:1px solid var(--hud-cyan); z-index:2000; transform:translateX(100%); transition:0.3s; display:flex; flex-direction:column; box-shadow:0 0 30px rgba(56,189,248,0.3);">
    <div style="padding:1.25rem; border-bottom:1px solid var(--hud-border); display:flex; justify-content:space-between; align-items:center;">
      <h3 style="color:#fff; font-size:1.1rem;">TERMINAL DE COTAÇÃO</h3>
      <button id="cart-close" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <div id="cart-empty" style="padding:3rem 1.5rem; text-align:center; color:var(--hud-muted);"><p>Nenhum item selecionado.</p></div>
    <div id="cart-items-list" style="flex:1; overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:0.6rem;"></div>
    <div id="cart-footer" style="padding:1.25rem; border-top:1px solid var(--hud-border); background:#04070e;">
      <div class="orcamento-form" style="border:1px solid var(--hud-border); padding:0.8rem; margin-bottom:0.8rem; background:rgba(255,255,255,0.02); border-radius:6px;">
        <input type="text" id="f-nome" placeholder="Nome Completo *" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--hud-border); color:#fff; padding:0.45rem; margin-bottom:0.4rem; border-radius:4px; font-family:inherit;">
        <input type="tel" id="f-tel" placeholder="WhatsApp *" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--hud-border); color:#fff; padding:0.45rem; margin-bottom:0.4rem; border-radius:4px; font-family:inherit;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.4rem;">
          <input type="text" id="f-cnpj" placeholder="CNPJ" style="background:rgba(255,255,255,0.05); border:1px solid var(--hud-border); color:#fff; padding:0.45rem; border-radius:4px; font-family:inherit;">
          <input type="text" id="f-vendedor" placeholder="Vendedor" style="background:rgba(255,255,255,0.05); border:1px solid var(--hud-border); color:#fff; padding:0.45rem; border-radius:4px; font-family:inherit;">
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:0.6rem; font-size:0.85rem;">
        <span>TOTAL MÓDULOS:</span><span id="cart-total-count">0</span>
      </div>
      <button id="btn-whatsapp-send" class="hud-cart-btn" style="width:100%; padding:0.75rem; cursor:pointer;">
        TRANSMITIR NO WHATSAPP
      </button>
      <button id="btn-limpar" style="width:100%; text-align:center; background:none; border:none; margin-top:0.4rem; font-size:0.75rem; color:var(--hud-muted); cursor:pointer;">Limpar Buffer</button>
    </div>
  </aside>

  <div id="cart-feedback" style="display:none"></div>

  <!-- COMPATIBILITY HOOKS -->
  <div id="banner-slider" style="display:none"><div class="banner-slide"></div><button id="banner-prev"></button><button id="banner-next"></button><div class="banner-dots"><button class="banner-dot"></button></div></div>
  <div id="categorias-grid" style="display:none"></div>
  <div id="filtros-bar" style="display:none"></div>
  <div id="produtos-section" style="display:none"></div>

  <script src="js/produtos.js"></script>
  <script src="js/carrinho.js"></script>
  <script>
    function renderProdutos(catId, termoBusca = '') {
      const grid = document.getElementById('produtos-grid');
      const empty = document.getElementById('nenhum-produto');
      if (!grid) return;
      let lista = PRODUTOS;
      if (catId && catId !== 'todos') lista = lista.filter(p => p.categoria === catId);
      if (termoBusca) {
        const t = termoBusca.toLowerCase();
        lista = lista.filter(p => p.nome.toLowerCase().includes(t) || p.referencia.toLowerCase().includes(t) || p.descricao.toLowerCase().includes(t));
      }
      if (lista.length === 0) { grid.innerHTML = ''; if (empty) empty.style.display = 'block'; return; }
      if (empty) empty.style.display = 'none';
      grid.innerHTML = lista.map(p => `
        <div class="hud-card">
          <img src="${p.imagens[0]}" alt="${p.nome}" class="hud-card-img" onerror="this.src='https://picsum.photos/seed/hud${p.id}/400/300'">
          <div class="hud-sku">// ${p.referencia}</div>
          <h3 class="hud-card-title"><a href="produto.html?id=${p.id}">${p.nome}</a></h3>
          <p class="hud-card-desc">${p.descricao}</p>
          <div class="hud-card-row">
            <div class="hud-qty">
              <button onclick="decrementarCard(${p.id})">−</button>
              <input type="number" id="qty-${p.id}" value="1" min="1" readonly>
              <button onclick="incrementarCard(${p.id})">+</button>
            </div>
            <button class="hud-add-btn" onclick="adicionarAoOrcamento(${p.id})">+ ADICIONAR</button>
          </div>
        </div>
      `).join('');
    }
    function initCategorias() {
      const row = document.getElementById('hud-cats');
      if (row) {
        row.innerHTML = CATEGORIAS.map(c => `
          <button class="hud-cat-pill ${c.id === 'todos' ? 'active' : ''}" onclick="filtrarPor('${c.id}')">
            ${c.icone} ${c.nome}
          </button>
        `).join('');
      }
    }
    function filtrarPor(catId) {
      document.querySelectorAll('.hud-cat-pill').forEach(p => p.classList.toggle('active', p.getAttribute('onclick')?.includes(`'${catId}'`)));
      renderProdutos(catId, document.getElementById('search-input')?.value || '');
    }
    function incrementarCard(id) { const i = document.getElementById(`qty-${id}`); if(i) i.value = parseInt(i.value)+1; }
    function decrementarCard(id) { const i = document.getElementById(`qty-${id}`); if(i && parseInt(i.value)>1) i.value = parseInt(i.value)-1; }
    function adicionarAoOrcamento(id) { const i = document.getElementById(`qty-${id}`); Carrinho.adicionar(id, parseInt(i?.value)||1); }
    function initSearch() { document.getElementById('search-input')?.addEventListener('input', e => renderProdutos('todos', e.target.value)); }
    document.addEventListener('DOMContentLoaded', () => { initCategorias(); renderProdutos('todos'); initSearch(); });
  </script>
</body>
</html>
